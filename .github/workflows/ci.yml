name: PoC CI

on:
  push:
    branches:
      - feature/v0.2-model-validation
      - feature/v0.3-ocean-data
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile
        run: python -m compileall app.py src tests

      - name: Script smoke check
        run: python scripts/build_ocean_features.py --help

      - name: Test
        run: python -m pytest -q
